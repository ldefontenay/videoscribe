[package]
name = "videoscribe-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Milestone 0 diagnostics for Video Scribe. Not shipped."

[dependencies]
# Same version Photo Scribe ships for its face models (PLAN.md §6).
tract-onnx = "0.21.18"
serde_json = "1"
# Same version as Photo Scribe. Spikes 0(e) to 0(g): SAPI, Media Foundation, WinHTTP, CNG.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Speech",
    "Win32_Networking_WinHttp",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
